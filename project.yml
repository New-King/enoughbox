name: EnoughBox
options:
  bundleIdPrefix: com.enoughbox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  EnoughBoxPluginSDK:
    path: Packages/EnoughBoxPluginSDK
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
targets:
  EnoughBox:
    type: application
    platform: macOS
    sources:
      - path: EnoughBox
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enoughbox.app
        PRODUCT_NAME: EnoughBox
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EnoughBox
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    dependencies:
      - package: EnoughBoxPluginSDK
        product: EnoughBoxPluginSDK
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - target: SamplePlugin
        embed: true
    scheme:
      testTargets: []
  SamplePlugin:
    type: bundle
    platform: macOS
    sources:
      - path: Plugins/SamplePlugin
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: com.enoughbox.sample
        PRODUCT_BUNDLE_IDENTIFIER: com.enoughbox.sample
        WRAPPER_EXTENSION: plugin
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundlePackageType: BNDL
        INFOPLIST_KEY_NSPrincipalClass: SamplePluginPlugin
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
    dependencies:
      - package: EnoughBoxPluginSDK
        product: EnoughBoxPluginSDK
