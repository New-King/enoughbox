name: EnoughBox
options:
  bundleIdPrefix: com.enoughbox
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0
targets:
  EnoughBox:
    type: application
    platform: macOS
    sources:
      - path: EnoughBox
        excludes:
          - "**/.DS_Store"
      - path: EnoughBox/Features/Translate
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enoughbox.app
        PRODUCT_NAME: EnoughBox
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        SWIFT_EMIT_LOC_STRINGS: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: EnoughBox/EnoughBox.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EnoughBox
        INFOPLIST_KEY_LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSAccessibilityUsageDescription: "EnoughBox reads selected text so tools can translate it."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "EnoughBox uses System Events to copy selected text for tools."
      configs:
        debug:
          ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    scheme:
      testTargets: []
schemes:
  EnoughBox:
    build:
      targets:
        EnoughBox: all
    run:
      config: Debug
      debugEnabled: false
